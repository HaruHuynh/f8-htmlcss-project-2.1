<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>F8-Project-2.1</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./assets/reset.css" />
        <link rel="stylesheet" href="./assets/styles.css" />
    </head>
    <body style="margin-bottom: 2000px">
        <!-- Header -->
        <header>
            <div class="fix-header">
                <div class="content">
                    <div class="navbar">
                        <!-- Logo -->
                        <a href="#!" class="logo">
                            <img
                                src="./assets/img/Logo.svg"
                                alt=""
                                class="brand-img"
                            />
                        </a>
                        <!-- Navigation -->
                        <ul class="menu-list">
                            <li class="menu-item">
                                <a href="#!">Home</a>
                            </li>
                            <li class="menu-item">
                                <a href="#!">Features</a>
                            </li>
                            <li class="menu-item">
                                <a href="#!">Pricing</a>
                            </li>
                            <li class="menu-item">
                                <a href="#!">About</a>
                            </li>
                            <li class="menu-item">
                                <a href="#!">Contact</a>
                            </li>
                        </ul>
                        <!-- Action -->
                        <div class="nav-action">
                            <a href="#!" class="login">Sign in</a>
                            <a href="#!" class="btn signup">Sign up</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main>
            <!-- Hero -->
            <section class="hero-section">
                <div class="content">
                    <div class="hero-wrapper">
                        <div class="hero-info">
                            <p class="intro">😎 EASY LEARNING PLATFORM</p>
                            <h1 class="title">Words learner come here.</h1>
                            <p class="desc">
                                Build skills with courses, certificates, and get
                                online knowledge from our world-class platform.
                            </p>
                            <div class="hero-cta">
                                <div class="btn start-btn">Get Started</div>
                                <a href="#!" class="play-btn">
                                    <img
                                        src="./assets/icons/play.svg"
                                        alt="Play Icon"
                                        class="play-icon"
                                    />
                                </a>
                            </div>
                        </div>
                        <div class="hero-content">
                            <img
                                src="./assets/img/hero.jpg"
                                alt="Hero Image"
                                class="hero-img"
                            />
                            <div class="course-card">
                                <img
                                    src="./assets/icons/book-01.svg"
                                    alt="Book 01"
                                    class="course-01"
                                />
                                <img
                                    src="./assets/icons/book-02.svg"
                                    alt="Book 02"
                                    class="course-02"
                                />
                                <p class="title">Courses 1000+</p>
                            </div>
                            <div class="schedule-card">
                                <p class="title">Schedules</p>
                                <img
                                    src="./assets/icons/schedule-hero-01.svg"
                                    alt="Schedule 01"
                                    class="schedule-01"
                                />
                                <img
                                    src="./assets/icons/schedule-hero-02.svg"
                                    alt="Schedule 02"
                                    class="schedule-02"
                                />
                                <img
                                    src="./assets/icons/schedule-hero-03.svg"
                                    alt="Schedule 03"
                                    class="schedule-03"
                                />
                                <img
                                    src="./assets/icons/schedule-hero-04.svg"
                                    alt="Schedule 04"
                                    class="schedule-04"
                                />
                            </div>
                            <div class="member-card">
                                <p class="title">Our Active Students</p>
                                <div class="avatar-group">
                                    <img
                                        src="./assets/img/avatar-hero-01.jpg"
                                        alt="Avatar 01"
                                        class="avatar avatar-01"
                                    />
                                    <img
                                        src="./assets/img/avatar-hero-02.jpg"
                                        alt="Avatar 02"
                                        class="avatar avatar-02"
                                    />
                                    <img
                                        src="./assets/img/avatar-hero-03.jpg"
                                        alt="Avatar 03"
                                        class="avatar avatar-03"
                                    />
                                    <img
                                        src="./assets/img/avatar-hero-04.jpg"
                                        alt="Avatar 04"
                                        class="avatar avatar-04"
                                    />
                                    <div class="avatar avatar-05" style=" --primary-color: #1ebfc1;">
                                        10K+
                                    </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            
        </main>
    </body>
</html>
