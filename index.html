<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>F8-Project-2.1</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./assets/reset.css" />
        <link rel="stylesheet" href="./assets/styles.css" />
    </head>
    <body>
        <!-- Header -->
        <header>
            <div class="fix-header">
                <div class="content">
                    <div class="navbar">
                        <!-- Logo -->
                        <a href="#!" class="logo">
                            <img
                                src="./assets/img/Logo.svg"
                                alt=""
                                class="brand-img"
                            />
                        </a>
                        <!-- Navigation -->
                        <ul class="menu-list">
                            <li class="menu-item">
                                <a href="#!">Home</a>
                            </li>
                            <li class="menu-item">
                                <a href="#!">Features</a>
                            </li>
                            <li class="menu-item">
                                <a href="#!">Pricing</a>
                            </li>
                            <li class="menu-item">
                                <a href="#!">About</a>
                            </li>
                            <li class="menu-item">
                                <a href="#!">Contact</a>
                            </li>
                        </ul>
                        <!-- Action -->
                        <div class="nav-action">
                            <a href="#!" class="login">Sign in</a>
                            <a href="#!" class="btn signup">Sign up</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main>
            <!-- Hero Section -->
            <section class="hero-section">
                <div class="content">
                    <div class="hero-wrapper">
                        <div class="hero-info">
                            <p class="intro">😎 EASY LEARNING PLATFORM</p>
                            <h1 class="title">Words learner come here.</h1>
                            <p class="desc">
                                Build skills with courses, certificates, and get
                                online knowledge from our world-class platform.
                            </p>
                            <div class="hero-cta">
                                <div class="btn start-btn">Get Started</div>
                                <a href="#!" class="play-btn">
                                    <img
                                        src="./assets/icons/play.svg"
                                        alt="Play Icon"
                                        class="play-icon"
                                    />
                                </a>
                            </div>
                        </div>
                        <div class="hero-content">
                            <img
                                src="./assets/img/hero.jpg"
                                alt="Hero Image"
                                class="hero-img"
                            />
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
